[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Multi-agent, Claude-powered crypto swing-trading bot (paper-first)"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11",
  "alpaca-py>=0.44",
  "pydantic>=2.7",
  "pyyaml>=6",
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
